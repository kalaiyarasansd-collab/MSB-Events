<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Background / Soft Shadow Filter -->
    <filter id="gold-shadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4A3408" flood-opacity="0.35" />
    </filter>

    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="outer-ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAC775" />
      <stop offset="18%" stop-color="#FFF5D6" />
      <stop offset="35%" stop-color="#D4A747" />
      <stop offset="55%" stop-color="#8C6219" />
      <stop offset="72%" stop-color="#F3DC9B" />
      <stop offset="88%" stop-color="#BA882E" />
      <stop offset="100%" stop-color="#543A0C" />
    </linearGradient>

    <linearGradient id="inner-ring-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D9" />
      <stop offset="25%" stop-color="#C59B3C" />
      <stop offset="50%" stop-color="#7B5314" />
      <stop offset="75%" stop-color="#F2D78E" />
      <stop offset="100%" stop-color="#A57624" />
    </linearGradient>

    <linearGradient id="gold-fill-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8E7" />
      <stop offset="20%" stop-color="#FCE192" />
      <stop offset="45%" stop-color="#D9A738" />
      <stop offset="70%" stop-color="#B27D1B" />
      <stop offset="90%" stop-color="#6F4B0E" />
      <stop offset="100%" stop-color="#483008" />
    </linearGradient>

    <linearGradient id="gold-bevel-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#FEE9A5" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#D9A738" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#54370A" stop-opacity="0.6" />
    </linearGradient>

    <radialGradient id="sphere-highlight" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="30%" stop-color="#FFEBB0" />
      <stop offset="65%" stop-color="#D29F33" />
      <stop offset="90%" stop-color="#845710" />
      <stop offset="100%" stop-color="#422904" />
    </radialGradient>

    <linearGradient id="crown-base-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5E14" />
      <stop offset="25%" stop-color="#FCE192" />
      <stop offset="50%" stop-color="#FFFDF7" />
      <stop offset="75%" stop-color="#D9A738" />
      <stop offset="100%" stop-color="#68450B" />
    </linearGradient>

    <linearGradient id="text-gold-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5932D" />
      <stop offset="50%" stop-color="#845A13" />
      <stop offset="100%" stop-color="#553707" />
    </linearGradient>
  </defs>

  <!-- Clean Pure White Circular Background -->
  <circle cx="500" cy="500" r="472" fill="#FFFFFF" />

  <!-- Outer Double Metallic Gold Ring -->
  <!-- Outer Bevel Ring -->
  <circle cx="500" cy="500" r="468" fill="none" stroke="url(#outer-ring-grad)" stroke-width="15" filter="url(#gold-shadow)" />
  <circle cx="500" cy="500" r="459" fill="none" stroke="url(#inner-ring-grad)" stroke-width="4" opacity="0.9" />
  <!-- Inner Fine Accent Ring -->
  <circle cx="500" cy="500" r="453" fill="none" stroke="#DCAE47" stroke-width="1.5" opacity="0.75" />

  <!-- ================= CROWN ================= -->
  <g id="crown" filter="url(#gold-shadow)">
    <!-- Crown Base Band (Curved Arc) -->
    <path d="M 390 286 C 426 298 462 304 500 304 C 538 304 574 298 610 286 C 606 274 555 264 500 264 C 445 264 394 274 390 286 Z" 
          fill="url(#crown-base-grad)" stroke="#6A450A" stroke-width="1.5" />
    
    <!-- Crown Rim Band Jewels / Oval studs -->
    <ellipse cx="430" cy="286" rx="6" ry="4" fill="#FFEAA5" stroke="#7A500F" stroke-width="1" />
    <ellipse cx="465" cy="291" rx="7" ry="5" fill="#FFFFFF" stroke="#845A13" stroke-width="1" />
    <ellipse cx="500" cy="293" rx="8" ry="5.5" fill="#FFEAA5" stroke="#845A13" stroke-width="1.2" />
    <ellipse cx="535" cy="291" rx="7" ry="5" fill="#FFFFFF" stroke="#845A13" stroke-width="1" />
    <ellipse cx="570" cy="286" rx="6" ry="4" fill="#FFEAA5" stroke="#7A500F" stroke-width="1" />

    <!-- Crown Body / Spikes -->
    <!-- 5 pointed ornate arches dipping down and rising up -->
    <path d="M 390 280
             C 380 245 355 210 354 192
             C 368 225 398 250 422 252
             C 426 230 422 195 422 165
             C 436 210 460 255 480 258
             C 486 210 495 150 500 118
             C 505 150 514 210 520 258
             C 540 255 564 210 578 165
             C 578 195 574 230 578 252
             C 602 250 632 225 646 192
             C 645 210 620 245 610 280
             C 575 292 538 298 500 298
             C 462 298 425 292 390 280 Z"
          fill="url(#gold-fill-vert)" stroke="#744D0C" stroke-width="2" stroke-linejoin="round" />

    <!-- Crown Front Highlight Facets (giving the 3D royal glow) -->
    <path d="M 500 120 L 492 245 C 496 250 504 250 508 245 Z" fill="#FFF8E0" opacity="0.8" />
    <path d="M 422 167 L 420 238 C 424 242 428 242 430 238 Z" fill="#FFF5D2" opacity="0.7" />
    <path d="M 578 167 L 570 238 C 574 242 578 242 580 238 Z" fill="#FFF5D2" opacity="0.7" />

    <!-- 5 Crown Pearls / Spheres at the tips -->
    <!-- Far Left -->
    <circle cx="354" cy="190" r="16" fill="url(#sphere-highlight)" stroke="#6C4509" stroke-width="1.5" />
    <!-- Mid Left -->
    <circle cx="422" cy="165" r="17" fill="url(#sphere-highlight)" stroke="#6C4509" stroke-width="1.5" />
    <!-- Center (Largest, highest) -->
    <circle cx="500" cy="116" r="20" fill="url(#sphere-highlight)" stroke="#6C4509" stroke-width="1.8" />
    <!-- Mid Right -->
    <circle cx="578" cy="165" r="17" fill="url(#sphere-highlight)" stroke="#6C4509" stroke-width="1.5" />
    <!-- Far Right -->
    <circle cx="646" cy="190" r="16" fill="url(#sphere-highlight)" stroke="#6C4509" stroke-width="1.5" />
  </g>

  <!-- ================= MONOGRAM "MSB" ================= -->
  <g id="monogram-msb" filter="url(#gold-shadow)">
    
    <!-- === LETTER 'M' (Classical Grand Roman Serif) === -->
    <!-- Left serif and column -->
    <g id="letter-M">
      <!-- M Body Path with thick-thin classical Roman proportions -->
      <path d="M 165 620 L 285 620 L 285 595 L 246 595 L 246 385 L 285 385 L 285 360 L 170 360 L 170 385 L 208 385 L 208 595 L 165 595 Z"
            fill="url(#gold-fill-vert)" stroke="#6D470A" stroke-width="2" />
      <!-- Diagonal down stroke (Thick) -->
      <path d="M 235 370 L 370 615 L 398 615 L 282 360 L 235 370 Z"
            fill="url(#gold-fill-vert)" stroke="#6D470A" stroke-width="2" />
      <!-- Diagonal up stroke (Thin) -->
      <path d="M 370 615 L 452 385 L 420 385 L 420 360 L 490 360 L 490 385 L 468 385 L 398 615 Z"
            fill="url(#gold-fill-vert)" stroke="#6D470A" stroke-width="1.5" />
      <!-- Right vertical column of M -->
      <path d="M 452 385 L 452 595 L 420 595 L 420 620 L 515 620 L 515 595 L 485 595 L 485 360 L 452 360 Z"
            fill="url(#gold-fill-vert)" stroke="#6D470A" stroke-width="2" />
    </g>

    <!-- === LETTER 'B' (Right side, classic curves) === -->
    <g id="letter-B">
      <!-- Back stem of B -->
      <path d="M 590 360 L 730 360 C 785 360 820 385 820 435 C 820 472 795 498 755 506 C 808 515 842 546 842 595 C 842 655 790 682 725 682 L 585 682 L 585 655 L 625 655 L 625 385 L 590 385 Z"
            fill="url(#gold-fill-vert)" stroke="#6D470A" stroke-width="2" />
      <!-- B Upper Counter (Hole) -->
      <path d="M 672 400 L 722 400 C 755 400 774 415 774 440 C 774 466 752 482 718 482 L 672 482 Z"
            fill="#FFFFFF" stroke="#6D470A" stroke-width="1.5" />
      <!-- B Lower Counter (Hole) -->
      <path d="M 672 522 L 728 522 C 765 522 788 540 788 572 C 788 605 762 624 722 624 L 672 624 Z"
            fill="#FFFFFF" stroke="#6D470A" stroke-width="1.5" />
    </g>

    <!-- === LETTER 'S' (Intertwined Royal Script, sweeps through center) === -->
    <g id="letter-S">
      <!-- Outer/Main S contour sweeping elegantly -->
      <path d="M 618 358 
               C 580 325 528 310 472 312
               C 400 315 348 355 350 425
               C 352 478 395 512 455 540
               C 542 580 598 610 596 678
               C 594 748 535 788 448 786
               C 382 785 320 750 280 705
               L 315 675
               C 348 718 400 746 450 746
               C 508 746 548 718 550 672
               C 552 625 512 595 442 560
               C 362 522 305 485 304 418
               C 302 338 368 274 468 270
               C 530 268 595 292 642 332 Z"
            fill="url(#gold-fill-vert)" stroke="#6D470A" stroke-width="3" stroke-linejoin="round" />

      <!-- S Facet Center Highlight Curve (giving that deep 3D embossed luster) -->
      <path d="M 470 290
               C 525 290 575 310 610 345
               L 590 365
               C 560 335 515 320 470 320
               C 390 320 340 365 342 422
               C 344 470 385 505 448 535
               C 538 578 584 612 582 675
               C 580 735 528 770 448 768
               C 395 767 345 740 305 700
               L 322 682
               C 358 720 402 742 448 742
               C 515 742 555 712 556 668
               C 558 615 518 582 435 542
               C 355 502 318 460 316 415
               C 314 345 375 292 470 290 Z"
            fill="#FFF5D6" opacity="0.65" />
    </g>

    <!-- Bevel highlight overlay strokes for pristine metallic finish -->
    <path d="M 175 365 L 280 365" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <path d="M 212 390 L 212 590" stroke="#FFF5D6" stroke-width="2" opacity="0.7" />
    <path d="M 252 380 L 372 610" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <path d="M 630 390 L 630 650" stroke="#FFF5D6" stroke-width="2" opacity="0.7" />
    <path d="M 630 365 L 725 365" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- ================= DIVIDER LINE WITH 'MSB' ================= -->
  <g id="divider-section" filter="url(#gold-shadow)">
    <!-- Left Horizontal Golden Line -->
    <line x1="175" y1="712" x2="350" y2="712" stroke="url(#crown-base-grad)" stroke-width="3" stroke-linecap="round" />
    <line x1="185" y1="714" x2="345" y2="714" stroke="#5E3E07" stroke-width="1" opacity="0.6" />

    <!-- Center 'MSB' Text -->
    <text x="500" y="736" 
          text-anchor="middle" 
          font-family="'Playfair Display', 'Cinzel', 'Georgia', serif" 
          font-size="64" 
          font-weight="bold" 
          letter-spacing="6" 
          fill="url(#gold-fill-vert)" 
          stroke="#68450B" 
          stroke-width="1.2">MSB</text>

    <!-- Right Horizontal Golden Line -->
    <line x1="650" y1="712" x2="825" y2="712" stroke="url(#crown-base-grad)" stroke-width="3" stroke-linecap="round" />
    <line x1="655" y1="714" x2="815" y2="714" stroke="#5E3E07" stroke-width="1" opacity="0.6" />
  </g>

  <!-- ================= SUBTITLE: EVENT MANAGEMENT ================= -->
  <g id="event-management-text" filter="url(#gold-shadow)">
    <text x="500" y="788" 
          text-anchor="middle" 
          font-family="'Cinzel', 'Playfair Display', 'Trajan Pro', 'Georgia', serif" 
          font-size="34" 
          font-weight="700" 
          letter-spacing="11" 
          fill="url(#text-gold-grad)" 
          stroke="#553606" 
          stroke-width="0.7">EVENT MANAGEMENT</text>
  </g>
</svg>
